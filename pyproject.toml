[project]
name = "fantasy-analysis"
version = "0.1.0"
description = "Data analysis for my fantasy football league"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "pandas",
    "polars",
    "pyarrow",
    "scipy",
    "scikit-learn",
    "statsmodels",
    "matplotlib",
    "seaborn",
    "plotly",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "espn-api>=1.0.1",
    "adjusttext>=1.4.0",
    "nflreadpy>=0.1.5",
]

[dependency-groups]
dev = [
    "jupyterlab",
    "ipykernel",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fantasy_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
